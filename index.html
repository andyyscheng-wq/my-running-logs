<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="IMG_2611.jpeg">
    <title>個人跑步日誌 & 丹尼爾斯 21 週 SUB 3 控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0086DB',
                        brandDark: '#006cb3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <!-- 導覽列 -->
    <nav class="bg-brand text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🏃‍♂️ SUB 3 🔥 丹尼爾斯課表</h1>
            <span class="text-sm bg-white/20 px-3 py-1 rounded-full">菁英訓練看板</span>
        </div>
    </nav>

    <!-- 主區塊 -->
    <main class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側：目標賽事、本週課表建議、跑量進度 -->
        <div class="md:col-span-1 space-y-6">
            <!-- 賽事目標卡片 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Target Race / 目標賽事</h2>
                <div class="text-xl font-bold text-gray-800" id="displayRaceName">載入中...</div>
                <div class="text-sm text-brand font-bold mt-1" id="displayRaceGoal">目標：--</div>
                
                <div class="mt-4 bg-blue-50 p-4 rounded-xl text-center">
                    <span class="block text-xs text-brand font-semibold">賽事倒數</span>
                    <span class="text-3xl font-black text-brand" id="countdownWeeks">--</span>
                    <span class="text-xs text-brand font-semibold"> 週</span>
                </div>

                <!-- 每週課表建議 (動態更新) -->
                <div class="mt-4 bg-slate-900 text-white p-4 rounded-xl text-xs space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                        <span class="text-yellow-400 font-bold text-sm">⚡ 丹尼爾斯質量課表</span>
                        <span class="text-gray-400 text-[10px]" id="phaseLabel">週期載入中</span>
                    </div>
                    <div>
                        <div class="text-brand font-semibold flex items-center gap-1">🔷 Q1 課表</div>
                        <div class="text-gray-200 mt-0.5 leading-relaxed" id="q1Suggestion">--</div>
                    </div>
                    <div>
                        <div class="text-rose-400 font-semibold flex items-center gap-1">🔶 Q2 課表</div>
                        <div class="text-gray-200 mt-0.5 leading-relaxed" id="q2Suggestion">--</div>
                    </div>
                </div>
                
                <button onclick="toggleModal('raceModal', true)" class="w-full mt-4 text-xs text-center text-gray-400 hover:text-brand transition">⚙️ 設定賽事目標</button>
            </div>

            <!-- 本週里程進度 (依課表%動態計算) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Weekly Volume</h2>
                        <span class="text-[10px] text-gray-400" id="weeklyPercentLabel">(基準 80 km)</span>
                    </div>
                    <button onclick="setMaxWeeklyGoal()" class="text-xs text-brand hover:underline">調整基準</button>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-3xl font-bold" id="currentWeeklyVolume">0</span>
                    <span class="text-gray-500 text-sm">/ <span id="targetWeeklyVolume">80</span> km</span>
                </div>
                <div class="w-full bg-gray-100 h-3 rounded-full mt-3 overflow-hidden">
                    <div id="weeklyProgressBar" class="bg-brand h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 右側：新增紀錄與歷史清單 -->
        <div class="md:col-span-2 space-y-6">
            <!-- 快速新增日誌 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="text-xl">📝</span> 紀錄今日訓練
                </h2>
                <form id="runForm" onsubmit="saveLog(event)" class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">訓練日期</label>
                        <input type="date" id="runDate" required class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">訓練類型</label>
                        <select id="runType" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                            <option value="E 輕鬆跑">E 輕鬆跑 (Easy)</option>
                            <option value="M 配速跑">M 配速跑 (Marathon Pace 4'15")</option>
                            <option value="T 閾值跑">T 閾值間歇 (Threshold)</option>
                            <option value="I 間歇跑">I 最大攝氧間歇 (Interval)</option>
                            <option value="R 重複跑">R 速度重複跑 (Repetition)</option>
                            <option value="L 長距離">L 長距離跑 (Long Run)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">里程 (km)</label>
                        <input type="number" step="0.01" id="runDistance" placeholder="例如: 12" required class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">平均配速 (分'秒")</label>
                        <input type="text" id="runPace" placeholder="例如: 4'12" required class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">體感與備忘錄</label>
                        <input type="text" id="runNotes" placeholder="例如：Q課表順暢吃完，T配速維持在 3'55~4'00" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                    </div>
                    <div class="col-span-2 mt-2">
                        <button type="submit" class="w-full bg-brand hover:bg-brandDark text-white font-semibold p-3 rounded-xl shadow-sm transition">儲存訓練日誌</button>
                    </div>
                </form>
            </div>

            <!-- 歷史紀錄清單 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span class="text-xl">📊</span> 訓練足跡
                    </h2>
                    <button onclick="clearAllLogs()" class="text-xs text-red-400 hover:text-red-600">清除全部</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-400 text-xs font-bold uppercase tracking-wider border-b border-gray-100">
                                <th class="py-3 px-4">日期 / 類型</th>
                                <th class="py-3 px-4">里程</th>
                                <th class="py-3 px-4">配速</th>
                                <th class="py-3 px-4 hidden sm:table-cell">體感備忘</th>
                                <th class="py-3 px-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y divide-gray-50 text-sm text-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 賽事設定彈窗 -->
    <div id="raceModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4 text-gray-800">⚙️ 設定目標賽事</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">賽事名稱</label>
                    <input type="text" id="inputRaceName" placeholder="例如：台北馬拉松" class="w-full p-2.5 border border-gray-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">賽事日期</label>
                    <input type="date" id="inputRaceDate" class="w-full p-2.5 border border-gray-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">目標成績</label>
                    <input type="text" id="inputRaceGoal" placeholder="例如：SUB 3:00 挑戰" class="w-full p-2.5 border border-gray-200 rounded-xl">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="toggleModal('raceModal', false)" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">取消</button>
                <button onclick="saveRaceSettings()" class="px-4 py-2 text-sm font-medium bg-brand text-white rounded-xl hover:bg-brandDark shadow-sm">儲存設定</button>
            </div>
        </div>
    </div>

    <script>
        const currentYear = new Date().getFullYear();
        let defaultRaceDate = `${currentYear}-12-20`;
        
        let raceData = JSON.parse(localStorage.getItem('run_race_data')) || {
            name: '台北馬拉松',
            date: defaultRaceDate,
            goal: 'SUB 3:00 挑戰'
        };
        // 目標最大週跑量預設為 80 公里
        let maxWeeklyGoal = parseFloat(localStorage.getItem('run_max_weekly_goal')) || 80;
        let currentTargetVolume = 80;
        let runLogs = JSON.parse(localStorage.getItem('run_logs')) || [];

        window.onload = function() {
            document.getElementById('runDate').value = new Date().toISOString().split('T')[0];
            updateRaceDOM();
            updateWeeklyProgress();
            renderLogs();
        };

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) {
                modal.classList.remove('hidden');
                document.getElementById('inputRaceName').value = raceData.name;
                document.getElementById('inputRaceDate').value = raceData.date;
                document.getElementById('inputRaceGoal').value = raceData.goal;
            } else {
                modal.classList.add('hidden');
            }
        }

        function saveRaceSettings() {
            raceData.name = document.getElementById('inputRaceName').value || '未命名賽事';
            raceData.date = document.getElementById('inputRaceDate').value;
            raceData.goal = document.getElementById('inputRaceGoal').value || '尚未設定目標';
            localStorage.setItem('run_race_data', JSON.stringify(raceData));
            updateRaceDOM();
            toggleModal('raceModal', false);
        }

        function updateRaceDOM() {
            document.getElementById('displayRaceName').innerText = raceData.name;
            document.getElementById('displayRaceGoal').innerText = `目標：${raceData.goal}`;
            
            if (raceData.date) {
                const today = new Date();
                today.setHours(0,0,0,0);
                const raceDate = new Date(raceData.date);
                raceDate.setHours(0,0,0,0);
                
                const timeDiff = raceDate.getTime() - today.getTime();
                const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                
                if (daysDiff > 0) {
                    const weeksDiff = (daysDiff / 7).toFixed(1);
                    document.getElementById('countdownWeeks').innerText = weeksDiff;
                    updateTrainingSuggestions(parseFloat(weeksDiff));
                } else if (daysDiff === 0) {
                    document.getElementById('countdownWeeks').innerText = '🔥 Race Week!';
                    updateTrainingSuggestions(0);
                } else {
                    document.getElementById('countdownWeeks').innerText = '已完賽';
                }
            }
        }

        // 丹尼爾斯 21 週完整課表邏輯
        function updateTrainingSuggestions(weeks) {
            const phaseLabel = document.getElementById('phaseLabel');
            const q1El = document.getElementById('q1Suggestion');
            const q2El = document.getElementById('q2Suggestion');
            const weeklyPercentLabel = document.getElementById('weeklyPercentLabel');

            let percent = 1.0;
            let roundWeek = Math.round(weeks);

            if (roundWeek >= 21) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 21 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = 'L長跑 = 不要超過 22.4 公里或 90 分鐘';
                q2El.innerHTML = '3.2km E + 3×(1.6km T + 2分休) + 3×(3分H + 2分慢跑) + 4×(200m R + 200m慢跑) + 1.6km E';
            } else if (roundWeek === 20) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 20 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '30 分鐘 E + <span class="text-yellow-400 font-bold">14.4 公里 M</span>';
                q2El.innerHTML = '3.2km E + 8km M + 1.6km E + 6.4km M + 3.2km E';
            } else if (roundWeek === 19) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 19 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '3.2km E + 5×(1.6km T + 1分休) + 3.2km E';
                q2El.innerHTML = '3.2km E + 4×(1.6km T + 1分休) + 4×(400m R + 400m慢跑) + 1.6km E';
            } else if (roundWeek === 18) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 18 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = '本週不用進行 Q 課表，整週都進行 E 強度課表';
                q2El.innerText = '其中兩天在最後附加 6～8 趟 ST (輕快跑)';
            } else if (roundWeek === 17) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 17 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = 'L長跑 = 不要超過 24 公里或 100 分鐘';
                q2El.innerHTML = '3.2km E + 3×(1.6km T + 3分休) + 3×(3分H + 2分慢跑) + 8×(200m R + 200m慢跑) + 1.6km E';
            } else if (roundWeek === 16) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 16 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '4.8km E + <span class="text-yellow-400 font-bold">16 公里 M</span>';
                q2El.innerHTML = '3.2km E + 9.6km M + 1.6km E + 8km M + 1.6km E';
            } else if (roundWeek === 15) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 15 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '3.2km E + 2×(3.2km T + 2分休) + 3.2km E';
                q2El.innerHTML = '3.2km E + 4.8km T + 3分休 + 3.2km T + 2分休 + 8×(200m R + 200m慢跑) + 2×(1.6km T + 1分休) + 1.6km E + 3.2km E';
            } else if (roundWeek === 14) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 14 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = '本週不用進行 Q 課表，整週都進行 E 強度課表';
                q2El.innerText = '其中兩天在最後附加 6～8 趟 ST (輕快跑)';
            } else if (roundWeek === 13) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 13 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = 'L長跑 = 不要超過 26 公里或 120 分鐘';
                q2El.innerHTML = '3.2km E + 3×(1.6km T + 1分休) + 3分休 + 3×(1,000m I + 3分慢跑) + 4×(400m R + 400m慢跑) + 1.6km E';
            } else if (roundWeek === 12) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 12 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '4.8km E + <span class="text-yellow-400 font-bold">20.8 公里 M</span>';
                q2El.innerHTML = '1.6km E + 9.6km M + 1.6km E + 8km M + 1.6km E + 3.2km M + 1.6km E';
            } else if (roundWeek === 11) {
                percent = 0.7;
                phaseLabel.innerText = '倒數 11 週・70%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '3.2km E + 2×(3.2km T + 2分休)';
                q2El.innerHTML = '3.2km E + 4.8km T + 3分休 + 3.2km T + 2分休 + 2×(400m R + 400m慢跑) + 2×(1.6km T + 1分休) + 1.6km E + 4×(200m R + 200m慢跑) + 1.6km E';
            } else if (roundWeek === 10) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 10 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = '本週不用進行 Q 課表，整週都進行 E 強度課表';
                q2El.innerText = '其中兩天在最後附加 6～8 趟 ST (輕快跑)';
            } else if (roundWeek === 9) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 9 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = 'L長跑 = 不要超過 26 公里或 140 分鐘';
                q2El.innerHTML = '3.2km E + 3×(1.6km T + 1分休) + 4×(3分H + 2分慢跑) + 6×(200m R + 200m慢跑) + 1.6km E';
            } else if (roundWeek === 8) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 8 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '20 分鐘 E + <span class="text-yellow-400 font-bold">22.4 公里 M</span>';
                q2El.innerHTML = '1.6km E + 9.6km M + 1.6km E + 11.2km M + 1.6km E';
            } else if (roundWeek === 7) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 7 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '6.4km E + 3×(3.2km T + 2分休) + 1.6km T + 1.6km E';
                q2El.innerHTML = '3.2km E + 2×(3.2km T + 2分休) + 8×(200m R + 200m慢跑) + 4×(1.6km T + 1分休) + 3.2km E';
            } else if (roundWeek === 6) {
                percent = 1.0;
                phaseLabel.innerText = '倒數 6 週・100%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = '本週不用進行 Q 課表，整週都進行 E 強度課表';
                q2El.innerText = '其中兩天在最後附加 6～8 趟 ST (輕快跑)';
            } else if (roundWeek === 5) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 5 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = 'L長跑 = 不要超過 26 公里或 140 分鐘';
                q2El.innerHTML = '3.2km E + 2×(4.8km T + 3分休) + 3.2km T + 3分休 + 4×(3分H + 2分慢跑) + 8×(200m R + 200m慢跑) + 1.6km E';
            } else if (roundWeek === 4) {
                percent = 0.9;
                phaseLabel.innerText = '倒數 4 週・90%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '10 分鐘 E + <span class="text-yellow-400 font-bold">22.4 公里 M</span>';
                q2El.innerHTML = '1.6km E + 12.8km M + 1.6km E + 8km M + 1.6km E';
            } else if (roundWeek === 3) {
                percent = 0.8;
                phaseLabel.innerText = '倒數 3 週・80%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerHTML = '60 分鐘 E + 3×(3.2km T + 2分休) + 1.6km T';
                q2El.innerHTML = '3.2km E + 2×(3.2km T + 2分休) + 2×(1.6km T + 1分休) + 3.2km E + 8×(200m R + 200m慢跑) + 3.2km E';
            } else if (roundWeek === 2) {
                percent = 0.7;
                phaseLabel.innerText = '倒數 2 週・70%P (約 ' + (maxWeeklyGoal * percent).toFixed(0) + ' km)';
                q1El.innerText = '本週不用進行 Q 課表，整週都進行 E 強度課表';
                q2El.innerText = '其中兩天在最後附加 6～8 趟 ST (輕快跑)';
            } else if (roundWeek === 1) {
                percent = 0.5;
                phaseLabel.innerText = '賽事週・減量與比賽日';
                q1El.innerHTML = '• 剩七天: 90分E<br>• 剩六天: 60分E<br>• 剩五天: 3×(1.6km T + 2分休)<br>• 剩四天: 60分E';
                q2El.innerHTML = '• 剩三天: 45分E<br>• 剩二天: 30分E<br>• 前一天: 30分E<br>• <span class="text-yellow-400 font-bold">比賽日: 42.195 km Race!</span>';
            } else {
                percent = 1.0;
                phaseLabel.innerText = '賽事週';
                q1El.innerText = '放鬆跑 20~30 分鐘';
                q2El.innerText = '賽事日穩健發揮，突破 Sub 3！';
            }

            // 更新週跑量目標值
            currentTargetVolume = Math.round(maxWeeklyGoal * percent);
            weeklyPercentLabel.innerText = `(${Math.round(percent * 100)}%P / 基準 ${maxWeeklyGoal}km)`;
            updateWeeklyProgress();
        }

        function setMaxWeeklyGoal() {
            const newGoal = prompt('請輸入最大週跑量基準 (km):', maxWeeklyGoal);
            if (newGoal && !isNaN(newGoal)) {
                maxWeeklyGoal = parseFloat(newGoal);
                localStorage.setItem('run_max_weekly_goal', maxWeeklyGoal);
                updateRaceDOM();
            }
        }

        function updateWeeklyProgress() {
            document.getElementById('targetWeeklyVolume').innerText = currentTargetVolume;
            
            const today = new Date();
            const currentDay = today.getDay(); 
            const distanceDiff = currentDay === 0 ? -6 : 1 - currentDay;
            
            const monday = new Date(today);
            monday.setDate(today.getDate() + distanceDiff);
            monday.setHours(0,0,0,0);

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);

            let currentSum = 0;
            runLogs.forEach(log => {
                const logDate = new Date(log.date);
                if (logDate >= monday && logDate <= sunday) {
                    currentSum += parseFloat(log.distance);
                }
            });

            currentSum = Math.round(currentSum * 100) / 100;
            document.getElementById('currentWeeklyVolume').innerText = currentSum;

            const percentage = Math.min((currentSum / currentTargetVolume) * 100, 100);
            document.getElementById('weeklyProgressBar').style.width = `${percentage}%`;
        }

        function saveLog(e) {
            e.preventDefault();
            const newLog = {
                id: Date.now(),
                date: document.getElementById('runDate').value,
                type: document.getElementById('runType').value,
                distance: parseFloat(document.getElementById('runDistance').value),
                pace: document.getElementById('runPace').value,
                notes: document.getElementById('runNotes').value || '無備忘錄'
            };

            runLogs.unshift(newLog);
            runLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('run_logs', JSON.stringify(runLogs));
            
            document.getElementById('runDistance').value = '';
            document.getElementById('runPace').value = '';
            document.getElementById('runNotes').value = '';
            
            updateWeeklyProgress();
            renderLogs();
        }

        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            if (runLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400 text-xs">暫無訓練紀錄，今天跑起來！</td></tr>`;
                return;
            }

            runLogs.forEach(log => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <div class="font-medium text-gray-800">${log.date}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${log.type}</div>
                    </td>
                    <td class="py-3 px-4 font-bold text-gray-900">${log.distance} <span class="text-xs font-normal text-gray-400">km</span></td>
                    <td class="py-3 px-4 font-mono text-gray-600">${log.pace}</td>
                    <td class="py-3 px-4 text-xs text-gray-500 max-w-xs truncate hidden sm:table-cell" title="${log.notes}">${log.notes}</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteLog(${log.id})" class="text-red-400 hover:text-red-600 text-xs font-medium">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteLog(id) {
            if(confirm('確定要刪除這筆訓練紀錄嗎？')) {
                runLogs = runLogs.filter(log => log.id !== id);
                localStorage.setItem('run_logs', JSON.stringify(runLogs));
                updateWeeklyProgress();
                renderLogs();
            }
        }

        function clearAllLogs() {
            if(confirm('⚠️ 警告：這將會刪除所有的訓練歷史紀錄，且無法復原！確定嗎？')) {
                runLogs = [];
                localStorage.setItem('run_logs', JSON.stringify(runLogs));
                updateWeeklyProgress();
                renderLogs();
            }
        }
    </script>
</body>
</html>
